<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSC316 A4</title>

    <!-- Load Google Font -->
    <link href='https://fonts.googleapis.com/css?family=Roboto:100,400,300,400italic,700' rel='stylesheet'
          type='text/css'>

    <!-- CSS libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/fontawesome.min.css">

    <!-- Custom CSS code -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="row justify-content-center" style="height: 10vh">
    <div class="align-self-center">
        <h1 style = "color: #FFF">How Small is Earth?</h1>
    </div>
</div>

<div class="container-fluid px-0">
  <div class="row g-3" style="margin-top:1vh;">

    <!-- main chart area (3/4 width) -->
    <div class="col-md-9 d-flex flex-column">
        <!-- stacked area chart -->
        <div id="stacked-area-chart" 
             style="height:60vh; background: rgba(20, 20, 26,0.75); border: thin solid rgb(49, 49, 49); border-radius:5px; margin-bottom:10px;">
        </div>

        <!-- brush -->
        <div id="timeline" 
             style="height:15vh; background: rgba(20, 20, 26,0.75); border: thin solid rgb(49, 49, 49); border-radius:5px; position: relative;">
        </div>
    </div>

    <!-- sidebar (1/4 width) -->
    <div class="col-md-3 d-flex flex-column" style="gap:10px;">

        <!-- top row: two side-by-side charts -->
        <div class="d-flex" style="height:60vh; gap:10px;">
            <div id="star-comparison-1" 
                 style="flex:1; background: rgba(20,20,26,0.75); border: thin solid rgb(49, 49, 49); border-radius:5px;">
            </div>

            <div id="star-comparison-2" 
                 style="flex:1; background: rgba(20,20,26,0.75); border: thin solid rgb(49, 49, 49); border-radius:5px;">
            </div>
        </div>

        <!-- bottom row: matches brush height -->
        <div id="filter" 
             style="height:15vh; background: rgba(20,20,26,0.75); border: thin solid rgb(49,49,49); border-radius:5px; padding:10px; overflow-y:auto; color:#FFF;">
            <h6 style="margin-bottom:8px; font-size:14px;">Filter Stars</h6>
            
            <!-- Distance Filter -->
            <div style="margin-bottom:8px;">
                <label style="font-size:11px; display:flex; justify-content:space-between;">
                    <span>Distance (ly)</span>
                    <span id="distance-value">0 - ∞</span>
                </label>
                <div class="range-slider-container">
                    <input type="range" id="distance-slider-min" class="range-min" min="0" max="100" value="0">
                    <input type="range" id="distance-slider-max" class="range-max" min="0" max="100" value="100">
                </div>
            </div>
            
            <!-- Radius Filter -->
            <div style="margin-bottom:8px;">
                <label style="font-size:11px; display:flex; justify-content:space-between;">
                    <span>Radius (km)</span>
                    <span id="radius-value">0 - ∞</span>
                </label>
                <div class="range-slider-container">
                    <input type="range" id="radius-slider-min" class="range-min" min="0" max="100" value="0">
                    <input type="range" id="radius-slider-max" class="range-max" min="0" max="100" value="100">
                </div>
            </div>
            
            <!-- Temperature Filter -->
            <div style="margin-bottom:8px;">
                <label style="font-size:11px; display:flex; justify-content:space-between;">
                    <span>Temperature (K)</span>
                    <span id="temp-value">0 - ∞</span>
                </label>
                <div class="range-slider-container">
                    <input type="range" id="temp-slider-min" class="range-min" min="0" max="100" value="0">
                    <input type="range" id="temp-slider-max" class="range-max" min="0" max="100" value="100">
                </div>
            </div>
            
            <!-- Luminosity Filter -->
            <div style="margin-bottom:8px;">
                <label style="font-size:11px; display:flex; justify-content:space-between;">
                    <span>Luminosity (W)</span>
                    <span id="lum-value">0 - ∞</span>
                </label>
                <div class="range-slider-container">
                    <input type="range" id="lum-slider-min" class="range-min" min="0" max="100" value="0">
                    <input type="range" id="lum-slider-max" class="range-max" min="0" max="100" value="100">
                </div>
            </div>
            
            <button id="reset-filter-btn" class="btn btn-outline-light btn-sm" style="width:100%; margin-top:5px; font-size:11px;">Reset Filters</button>
        </div>

    </div>

    <!-- brush controls -->
    <div class="row justify-content-center" style="margin-top:10px; margin-bottom:20px; width:100%;">
        <div class="col-auto">
            <button id="reset-brush-btn" class="btn btn-outline-light btn-sm">Reset Brush</button>
        </div>
    </div>

  </div>
</div>



</div>

<!-- Load JS libraries -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<!-- d3 -->
<script src="https://d3js.org/d3.v7.min.js"></script>

<!-- Shared helpers -->
<script src="js/tooltip.js"></script>

<!-- Visualization objects -->
 <script src="js/comparisonChart.js"></script>
<script src="js/starDisplayChart.js"></script>
<script src="js/minimap.js"></script>

<!-- Load data, create visualizations -->
<script src="js/main.js"></script>
</body>
</html>
